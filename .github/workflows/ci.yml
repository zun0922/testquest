# CI（テスト計画書 v1.0 §10.6 準拠）
# npm ci → 型チェック → 実行時脆弱性 → 単体(Vitest) → E2E(Playwright・ヘッドレス)
# ※ このリポジトリを GitHub に push した時点で有効化される。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一ブランチの古い実行は自動キャンセル（無駄なCI実行を抑制）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Node 24（ローカル開発環境と一致）。vite 8 / @vitejs/plugin-react 6 は
      # engines.node: ^20.19.0 || >=22.12.0 を要求するため 20 の解決結果に依存させない。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 依存インストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      # 実行時依存（production）の脆弱性をゲートにする。
      # 2026-08-21（宿題B-2）に vite 8 / vitest 4 へ更新し dev 側も 0 件化したが、
      # dev ツールチェーンの新規脆弱性でCIを止めないため、ゲートは実行時依存に限定する。
      - name: 実行時依存の脆弱性チェック
        run: npm audit --omit=dev --audit-level=moderate

      - name: 単体テスト（Vitest）
        run: npm run test

      - name: Playwright ブラウザ導入
        run: npx playwright install --with-deps chromium

      - name: E2E（Playwright・ヘッドレス）
        run: npm run test:e2e

      - name: E2Eレポート保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
